<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Anotações</title>
</head>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        padding: 20px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    .addAnotacao {
        display: flex;
        align-items: center;
        padding: 14px 18px;
        background-color: antiquewhite;
        border: 1px solid #e3d2b9;
        border-radius: 8px;
        gap: 20px;
    }

    .addAnotacao .titulo,
    .addAnotacao .descricao {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .addAnotacao label {
        font-size: 14px;
        font-weight: bold;
    }

    .addAnotacao input {
        width: 200px;
        padding: 7px 10px;
        border: 1px solid #d2be9e;
        border-radius: 5px;
        font-size: 14px;
    }

    .addAnotacao input:focus {
        outline: 2px solid burlywood;
        border-color: transparent;
    }

    .addAnotacao h1 {
        font-size: 30px;
        margin-right: 6px;
    }

    .addAnotacao button {
        margin: 4px;
        padding: 9px 16px;
        background-color: burlywood;
        border: 1px solid #b8905e;
        border-radius: 5px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
    }

    .addAnotacao button:hover {
        background-color: #c89d66;
    }

    main {
        flex: 1;
        border: 2px solid black;
        margin-top: 10px;
    }

    #lista {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        max-width: 100%;
    }

    li {
        margin-top: 10px;
        margin-left: 10px;
        background-color: antiquewhite;
        max-width: auto;
        list-style: none;
        padding: 10px;
        border-radius: 0 8px 8px 8px;
        text-align: center;
    }
</style>

<body>
    <header>
        <div class="addAnotacao">
            <h1>Anotação</h1>
            <div class="titulo"><label for="tituloAnotacao">Título</label>
                <input id="tituloAnotacao" placeholder="Digite o título da anotação">
            </div>
            <div class="descricao"><label for="descricaoAnotacao">Descrição</label>
                <input id="descricaoAnotacao" placeholder="Digite a descrição da anotação">
            </div>

            <button onclick="adicionar()">Adicionar</button>
        </div>

    </header>
    <main>
        <ul id="lista"></ul>
    </main>
    <script>
        // let contador = 1;
        // localStorage.clear();
        // window.location.reload();

        function obterAnotacoes() {
            const dados = localStorage.getItem("anotacoes");
            return dados ? JSON.parse(dados) : [];
        }

        function adicionar() {
            const titulo = document.getElementById("tituloAnotacao");
            const descricao = document.getElementById("descricaoAnotacao");

            if (titulo.value.trim() === "" || descricao.value.trim() === "") return;

            const novaAnotacao = {
                // resultados bassou vai disputar a Christian de Nova estanumero: contador,
                id: Date.now(),
                titulo: titulo.value.trim(),
                descricao: descricao.value.trim()
            };

            const anotacoes = obterAnotacoes();
            anotacoes.push(novaAnotacao);
            localStorage.setItem("anotacoes", JSON.stringify(anotacoes));
            // contador = contador + 1;
            titulo.value = "";
            descricao.value = "";
            listar();
        }

        function listar() {
            const lista = document.querySelector("#lista");
            lista.innerHTML = "";
            obterAnotacoes().forEach(anotacao => {
                const item = document.createElement("li");
                item.innerHTML = `<strong>${anotacao.titulo}</strong><br>${anotacao.descricao}`;
                lista.appendChild(item);
            });
        }

        listar();
    </script>
</body>

</html>
